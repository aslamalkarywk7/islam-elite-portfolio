<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Luxury Champagne Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6A35"/>
      <stop offset="30%" stop-color="#C9A96E"/>
      <stop offset="70%" stop-color="#E8D49A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>

    <!-- Soft outer glow for the lines -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Animated Drawing Paths -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left Elegant Structure (Main Tower) -->
    <path d="M 30 75 V 35 L 50 20 L 50 75" stroke-dasharray="150" stroke-dashoffset="150">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>

    <!-- Right Modern Extension (Villa/Annex) -->
    <path d="M 50 55 L 70 40 L 70 75" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>

    <!-- Foundation Line -->
    <path d="M 20 75 H 80" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0" dur="1.5s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
    
    <!-- Abstract Diamond (Investment / Value indicator) -->
    <polygon points="50,6 56,15 50,24 44,15" fill="url(#gold)" stroke="none" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="2s" begin="2.5s" fill="freeze" />
      <!-- Slow floating animation after it appears -->
      <animateTransform attributeName="transform" type="translate" values="0,2; 0,-2; 0,2" dur="5s" begin="2.5s" repeatCount="indefinite" />
    </polygon>

  </g>
</svg>
